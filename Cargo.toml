[package]
name = "navidrome-discord-rpc"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Show the track currently playing on Navidrome as Discord Rich Presence"
license = "AGPL-3.0-or-later"
repository = "https://github.com/S4ntyC1t/Navidrom-Discord-RCP-Rust"

[dependencies]
discord-rich-presence = "1.1.0"
reqwest = { version = "0.11", features = ["blocking"] }
serde_json = "1.0"
# Subsonic token authentication (t = md5(password + salt)) is mandated by the
# Subsonic API spec; this is the reference implementation of that one hash.
md5 = "0.7"

[profile.release]
strip = true
lto = true
